# The web version on GitHub Pages: every push to main (and a manual run) checks the game's scripts, builds dist/pages with
# tools/pages-build.cjs and publishes it. Pages must use «GitHub Actions» as its source (Settings → Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the game's scripts
        run: for f in live/*.js tools/pages-build.cjs; do node --check "$f"; done
      - name: Build the site
        run: node tools/pages-build.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
