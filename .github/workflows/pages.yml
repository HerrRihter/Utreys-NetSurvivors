# The web version on GitHub Pages: every push to main (and a manual run) checks the game's scripts, runs the headless checks, builds dist/pages with
# tools/pages-build.cjs and publishes it. Pages must use «GitHub Actions» as its source (Settings → Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check the game's scripts
        run: for f in live/*.js tools/pages-build.cjs; do node --check "$f"; done
      - name: Check the course content
        run: node tools/build-content.mjs --check
      - name: Run the checks that need no browser
        run: for t in edu ability aim defense ach; do echo "== $t"; node tools/$t-check.mjs || exit 1; done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Pillow (the textures are converted to WebP)
        run: pip install pillow==13.0.0
      - name: Build the site
        run: node tools/pages-build.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
