# The web version on GitHub Pages: every push to main (and a manual run) installs the tools (npm ci), checks the scripts, the content, the
# headless checks and the Firestore rules (emulator), builds dist/pages with tools/pages-build.cjs and publishes it. Pages must use «GitHub Actions» as its source (Settings → Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install the tools (package.json)
        run: npm ci
      - name: Check the game's scripts
        run: for f in live/*.js live/learn/*.js tools/pages-build.cjs; do node --check "$f"; done
      - name: Check the content and run the checks that need no browser
        run: npm run check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the Firestore rules on the emulator
        run: npm run check:rules
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Pillow (the textures are converted to WebP)
        run: pip install pillow==13.0.0
      - name: Build the site
        run: node tools/pages-build.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
